name: Daily Live Picks

on:
  schedule:
    - cron: '20 20 * * *'
  workflow_dispatch:        # manual re-run from GitHub mobile

jobs:
  run-live-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show commit + branch
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run live TAB pipeline
        # A deploy-guard block exits 1 here -> this step fails -> red X in the
        # GitHub mobile Actions tab, and latest_picks.json is left untouched.
        run: python run_live_pipeline.py --source tab
      - name: Upload picks artifact
        if: always()           # upload on success OR failure for inspection
        uses: actions/upload-artifact@v4
        with:
          name: latest-picks
          path: |
            latest_picks.json
            latest_picks.csv
          if-no-files-found: ignore
